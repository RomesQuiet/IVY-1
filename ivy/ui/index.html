<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IVY-1</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #11161f;
    --border: #1e2733;
    --accent: #4dd0e1;
    --accent-dim: #1e5f68;
    --text: #d4dae3;
    --text-dim: #6b7785;
    --user: #7ab8ff;
    --error: #ff6b6b;
    --ok: #66bb6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Mono", Menlo, monospace;
    font-size: 13px;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    -webkit-app-region: drag;
    user-select: none;
  }
  header button, header .indicator, header select { -webkit-app-region: no-drag; }
  .title {
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--accent);
    font-size: 12px;
  }
  .indicator {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.2s, box-shadow 0.2s;
    margin-left: auto;
  }
  .indicator.idle      { background: #3a4552; }
  .indicator.listening { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.2s infinite; }
  .indicator.thinking  { background: #ffb74d; box-shadow: 0 0 12px #ffb74d; animation: pulse 0.6s infinite; }
  .indicator.speaking  { background: var(--ok); box-shadow: 0 0 12px var(--ok); animation: pulse 0.9s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.85); }
  }
  .state-label {
    font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1.5px;
  }
  select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 6px; font-family: inherit; font-size: 11px;
    outline: none;
  }

  /* main wrapper */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    margin-bottom: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { color: var(--user); }
  .msg.user::before { content: "You › "; color: var(--text-dim); }
  .msg.assistant { color: var(--text); }
  .msg.assistant::before { content: "Ivy › "; color: var(--accent); font-weight: 600; }
  .msg.tool {
    display: flex; flex-direction: column; gap: 4px;
    color: var(--text-dim); font-size: 12px; margin: 4px 0 4px 8px;
    padding: 5px 10px; border-left: 2px solid var(--accent-dim);
    background: rgba(77, 208, 225, 0.04); border-radius: 0 6px 6px 0;
    cursor: pointer; white-space: normal; max-width: 760px;
  }
  .msg.tool .row { display: flex; align-items: center; gap: 8px; }
  .msg.tool .status { width: 14px; text-align: center; flex: none; }
  .msg.tool.running .status::before { content: "◌"; display: inline-block; animation: spin 1s linear infinite; color: #ffb74d; }
  .msg.tool.ok .status::before { content: "✓"; color: var(--ok); }
  .msg.tool.fail { border-left-color: var(--error); }
  .msg.tool.fail .status::before { content: "✗"; color: var(--error); }
  .msg.tool .more {
    display: none; white-space: pre-wrap; font-size: 11px; color: var(--text-dim);
    border-top: 1px solid var(--border); padding-top: 4px; max-height: 220px; overflow: auto;
  }
  .msg.tool.open .more { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .typing { color: var(--text-dim); }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  #suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  #suggestions button { font-size: 12px; padding: 6px 12px; border-radius: 14px; }
  #stopBtn { display: none; color: var(--error); }
  body.busy #stopBtn { display: inline-block; }
  .msg.system { color: var(--text-dim); font-size: 11px; font-style: italic; }
  .msg.error { color: var(--error); }
  .msg.note { color: #ffb74d; }

  .cursor {
    display: inline-block; width: 8px; background: var(--accent);
    animation: blink 0.9s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
    background: var(--panel);
  }
  #input {
    flex: 1; background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 6px;
    font-family: inherit; font-size: 13px; outline: none;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: var(--accent-dim); }

  button {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 9px 14px; border-radius: 6px;
    font-family: inherit; font-size: 12px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button.active {
    background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
  }
  .icon-btn { padding: 9px 12px; font-size: 14px; }

  /* sidebar */
  #sidebar {
    width: 380px;
    min-width: 320px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: #0d1218;
    overflow: hidden;
    transition: margin-right 0.2s;
  }
  #sidebar.hidden {
    display: none;
  }
  #console {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-dim);
    font-family: -apple-system, "SF Mono", Menlo, monospace;
  }
  #console::-webkit-scrollbar { width: 6px; }
  #console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .console-line {
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 2px;
  }
  .console-line.cmd { color: var(--user); }
  .console-line.err { color: var(--error); }
  .console-line.out { color: var(--text); }
  #console-input-wrap {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #consoleInput {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }
  #consoleInput:focus { border-color: var(--accent-dim); }
</style>
</head>
<body>

<header>
  <span class="title">IVY-1</span>
  <span class="state-label" id="mode">text</span>
  <select id="model" title="Model routing">
    <option value="auto">auto</option>
    <option value="openai/gpt-oss-120b">gpt-oss-120b</option>
    <option value="openai/gpt-oss-20b">gpt-oss-20b (faster)</option>
  </select>
  <span class="state-label" id="stateLabel">idle</span>
  <span class="indicator idle" id="indicator"></span>
  <button id="sidebarBtn" class="icon-btn" title="Toggle console">&gt;_</button>
</header>

<div id="main">
  <div id="chat-wrap">
    <div id="chat"></div>
    <footer>
      <input id="input" type="text" placeholder="Ask Ivy anything — or tell her to do something…" autofocus />
      <button id="stopBtn" class="icon-btn" title="Stop (Esc)">■</button>
      <button id="wakeBtn" class="icon-btn" title="Wake-word mode">💤</button>
      <button id="muteBtn" class="icon-btn" title="Mute voice">🔊</button>
    </footer>
  </div>

  <aside id="sidebar" class="hidden">
    <div id="console"></div>
    <div id="console-input-wrap">
      <input id="consoleInput"
        placeholder="Type /wake, /sleep, /model, /reset, /memories, /quit or a message..." />
    </div>
  </aside>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const wakeBtn = document.getElementById('wakeBtn');
const muteBtn = document.getElementById('muteBtn');
const indicator = document.getElementById('indicator');
const stateLabel = document.getElementById('stateLabel');
const modeEl = document.getElementById('mode');
const modelSel = document.getElementById('model');
const sidebarBtn = document.getElementById('sidebarBtn');
const sidebar = document.getElementById('sidebar');
const consoleEl = document.getElementById('console');
const consoleInput = document.getElementById('consoleInput');

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
function consoleBottom() { consoleEl.scrollTop = consoleEl.scrollHeight; }

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

function setState(s) {
  indicator.className = 'indicator ' + s;
  stateLabel.textContent = s;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- console ----------
window.appendConsole = function(line, cls) {
  const div = document.createElement('div');
  div.className = 'console-line ' + (cls || 'out');
  div.textContent = line;
  consoleEl.appendChild(div);
  consoleBottom();
};

// ---------- state / streaming ----------
window.setStatus = (msg) => {
  if (!msg) return;
  appendConsole(msg);
};

function clearTyping() {
  if (window._typingEl) { window._typingEl.remove(); window._typingEl = null; }
}

function showTyping() {
  clearTyping();
  const div = addMsg('assistant typing', '');
  div.innerHTML = '<span>●</span><span>●</span><span>●</span>';
  window._typingEl = div;
}

function setBusy(on) {
  document.body.classList.toggle('busy', on);
  inputEl.disabled = on;
  if (on) { setState('thinking'); showTyping(); }
}

window.appendToken = (t) => {
  clearTyping();
  if (!window._currentEl) {
    window._currentEl = addMsg('assistant', '');
    window._currentText = '';
  }
  window._currentText += t;
  window._currentEl.innerHTML =
    escapeHtml(window._currentText) + '<span class="cursor"></span>';
  scrollBottom();
};

window.endMessage = () => {
  clearTyping();
  if (window._currentEl) {
    window._currentEl.textContent = window._currentText;
    window._currentEl = null;
    window._currentText = '';
  }
  setBusy(false);
  setState('idle');
  inputEl.focus();
};

// Tool chips: "▶️ YouTube · gotham chess" with a spinner, then ✓ or ✗.
// Click a chip to see the code it ran and what came back.
window.showTool = (name, label, detail) => {
  clearTyping();
  window._currentEl = null;          // text after a tool starts a new bubble
  const div = document.createElement('div');
  div.className = 'msg tool running';
  div.dataset.name = name;
  div.innerHTML = '<div class="row"><span class="status"></span><span class="label"></span></div>' +
                  '<div class="more"></div>';
  div.querySelector('.label').textContent = label;
  div.querySelector('.more').textContent = detail || '';
  div.addEventListener('click', () => div.classList.toggle('open'));
  chatEl.appendChild(div);
  scrollBottom();
  if (document.body.classList.contains('busy')) showTyping();
};

window.toolDone = (name, ok, preview) => {
  const chip = [...chatEl.querySelectorAll('.msg.tool.running')].find(d => d.dataset.name === name);
  if (!chip) return;
  chip.classList.remove('running');
  chip.classList.add(ok ? 'ok' : 'fail');
  const more = chip.querySelector('.more');
  more.textContent = (more.textContent ? more.textContent + '\n\n→ ' : '→ ') + preview;
};

window.showError = (msg) => {
  clearTyping();
  let friendly = msg;
  if (/rate.?limit|quota|413|429/i.test(msg)) friendly = 'Out of free model quota for a moment — try again shortly.';
  else if (/connection|resolve|network|timed out/i.test(msg)) friendly = "I can't reach the internet right now.";
  addMsg('error', friendly);
};

window._simulate_user = function(text) {
  const sug = document.getElementById('suggestions');
  if (sug) sug.remove();
  addMsg('user', text);
  setBusy(true);
};

// Keeps the wake button in sync when wake mode changes from Python
// (console /wake, /sleep, or a listener that failed to start).
window.setWakeUI = function(on) {
  wakeBtn.classList.toggle('active', on);
  modeEl.textContent = on ? 'wake' : 'text';
};

// macOS is keeping Ivy blind: say so, and offer the fix.
window.showPermissions = (missing) => {
  const what = missing.map(m => m === 'screen' ? 'see the screen' : 'click and type').join(' or ');
  const div = addMsg('note', `macOS isn't letting Ivy ${what} yet, so she can't check her own work. `);
  const b = document.createElement('button');
  b.textContent = 'Fix this';
  b.addEventListener('click', async () => {
    try { await pywebview.api.fix_permissions(); } catch (e) {}
    b.remove();
    div.append('Switch Ivy (or Python / Terminal) on in the settings that opened, then quit and reopen Ivy.');
  });
  div.appendChild(b);
};

window.beginMessage = function() {
  window._currentEl = null;
  window._currentText = '';
};
// ---------- actions ----------
async function send(textArg) {
  const text = (textArg || inputEl.value).trim();
  if (!text) return;
  inputEl.value = '';
  const sug = document.getElementById('suggestions');
  if (sug) sug.remove();
  addMsg('user', text);
  setBusy(true);
  try { await pywebview.api.send(text); }
  catch (e) {
    window.showError(String(e));
    setBusy(false);
  }
}

async function stop() {
  try { await pywebview.api.stop(); } catch (e) {}
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stop(); });
document.getElementById('stopBtn').addEventListener('click', stop);

wakeBtn.addEventListener('click', async () => {
  const active = wakeBtn.classList.toggle('active');
  try {
    await pywebview.api.set_wake(active);
    modeEl.textContent = active ? 'wake' : 'text';
  } catch (e) { window.showError(String(e)); }
});

let muted = false;
muteBtn.addEventListener('click', async () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('active', muted);
  try { await pywebview.api.set_mute(muted); } catch (e) { console.error(e); }
});

modelSel.addEventListener('change', async () => {
  const v = modelSel.value;
  try { await pywebview.api.set_model(v === 'auto' ? null : v); }
  catch (e) { window.showError(String(e)); }
});

sidebarBtn.addEventListener('click', () => {
  const hidden = sidebar.classList.toggle('hidden');
  sidebarBtn.classList.toggle('active', !hidden);
});

consoleInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const text = consoleInput.value.trim();
    if (!text) return;
    consoleInput.value = '';
    try { await pywebview.api.console_cmd(text); }
    catch (e) { appendConsole('[error] ' + e, 'err'); }
  }
});

// ---------- startup ----------
let readyShown = false;
window.onReady = () => {
  if (readyShown) return;
  readyShown = true;
  if (window._bootMsg) window._bootMsg.remove();
  addMsg('system', 'IVY-1 — ready. Type, or press 💤 and say "OK Ivy". Esc stops her.');
  const sug = document.createElement('div');
  sug.id = 'suggestions';
  for (const q of ["What's the weather?", "Play lofi hip hop on YouTube", "Play Queen on Spotify",
                   "Set a 10 minute timer for tea", "What's on my screen?", "What can you do?"]) {
    const b = document.createElement('button');
    b.textContent = q;
    b.addEventListener('click', () => send(q));
    sug.appendChild(b);
  }
  chatEl.appendChild(sug);
  setState('idle');
};

window.addEventListener('pywebviewready', async () => {
  appendConsole('IVY-1 — console ready (/help for commands)');
  let ready = false;
  try { ready = await pywebview.api.is_ready(); } catch (e) {}
  if (ready) { window.onReady(); return; }
  window._bootMsg = addMsg('system', 'Starting up…');
  setState('thinking');
});
</script>
</body>
</html>
